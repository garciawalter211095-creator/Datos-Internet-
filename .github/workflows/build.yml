name: Compilar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-disabled: true
      - name: Descomprimir proyecto
        run: unzip -q ./*.zip -d proj
      - name: Compilar
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: datos-widget-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Datos Widget (última versión)
          files: proj/app/build/outputs/apk/debug/app-debug.apk
